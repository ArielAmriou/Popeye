services:
  poll:
    build: poll/
    ports:
      - 5000:80
    env_file:
      - .env.poll
    networks:
      - poll-tier
  redis:
    image: "redis:7-alpine"
    expose:
      - 6379
    networks:
      - poll-tier
      - back-tier
  worker:
    build: worker/
    env_file:
      - .env.poll
      - .env.login
      - .env.result
    networks:
      - back-tier
  result:
    build: result/
    ports:
      - 5001:80
    env_file:
      - .env.poll
      - .env.login
      - .env.result
    networks:
      - result-tier
  db:
    image: postgres:17
    env_file:
      - .env.result
      - .env.login
    networks:
      - result-tier
      - back-tier
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  db-data:

networks:
  poll-tier:
    driver: bridge
  back-tier:
    driver: bridge
  result-tier:
    driver: bridge
