services:
  poll:
    build: poll/
    restart: on-failure
    ports:
      - 5000:80
    env_file:
      - .env.poll
    networks:
      - poll-tier
    depends_on:
      - redis
      - db
  redis:
    image: "redis:7-alpine"
    restart: on-failure
    expose:
      - 6379
    networks:
      - poll-tier
      - back-tier
  worker:
    build: worker/
    restart: on-failure
    env_file:
      - .env.poll
      - .env.login
      - .env.result
      - .env.db
    networks:
      - back-tier
    depends_on:
      - redis
      - db
  result:
    build: result/
    restart: on-failure
    ports:
      - 5001:80
    env_file:
      - .env.login
      - .env.result
      - .env.db
    networks:
      - result-tier
    depends_on:
      - db
  db:
    image: postgres:16
    container_name: database
    restart: on-failure
    env_file:
      - .env.db
      - .env.login
    networks:
      - result-tier
      - back-tier
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  db-data:

networks:
  poll-tier:
    driver: bridge
  back-tier:
    driver: bridge
  result-tier:
    driver: bridge
